name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore GTAIVSetupUtility.csproj -r win-x64
      
    - name: Publish Self-Contained Single-File
      run: |
        dotnet publish GTAIVSetupUtility.csproj --configuration Release --output ./publish/SC_SingleFile -r win-x64 --self-contained true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=true -p:TrimMode=link -p:PublishReadyToRun=false -p:InvariantGlobalization=true -p:DebugType=None -p:DebugSymbols=false
        
    - name: Publish Framework-Dependent Single-File
      run: |
        dotnet publish GTAIVSetupUtility.csproj --configuration Release --output ./publish/FD_SingleFile -r win-x64 --self-contained false -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=true -p:TrimMode=link -p:DebugType=None -p:DebugSymbols=false

    - name: Publish Self-Contained Folder
      run: |
        dotnet publish GTAIVSetupUtility.csproj --configuration Release --output ./publish/SC_Folder -r win-x64 --self-contained true -p:PublishTrimmed=true -p:TrimMode=link -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false

    - name: Upload Self-Contained Single-File
      uses: actions/upload-artifact@v4
      with:
        name: GTAIVSetupUtility-SelfContained-SingleFile-${{ github.sha }}
        path: ./publish/SC_SingleFile
        retention-days: 90

    - name: Upload Framework-Dependent Single-File
      uses: actions/upload-artifact@v4
      with:
        name: GTAIVSetupUtility-FrameworkDependent-SingleFile-${{ github.sha }}
        path: ./publish/FD_SingleFile
        retention-days: 90

    - name: Upload Self-Contained Folder
      uses: actions/upload-artifact@v4
      with:
        name: GTAIVSetupUtility-SelfContained-Folder-${{ github.sha }}
        path: ./publish/SC_Folder
        retention-days: 90
